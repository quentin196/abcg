function mIndexTable(cols, hideOpHead){
  var w = el("div","idxtbl","");
  var tb = document.createElement("table");
  var htr = document.createElement("tr");
  ["#"].concat(cols).concat([hideOpHead?"":"操作"]).forEach(function(h){ var th=document.createElement("th"); th.textContent=h; htr.appendChild(th); });
  tb.appendChild(htr);
  var n = 0;
  function addRow(){
    n++;
    var tr = document.createElement("tr");
    var td0 = document.createElement("td"); td0.textContent = String(tb.rows.length-1+0 || 1);
    tr.appendChild(td0);
    cols.forEach(function(){ var td=document.createElement("td"); td.appendChild(mInput("1 ~ 99,999,999")); tr.appendChild(td); });
    var tda = document.createElement("td");
    var add = el("span","idxadd",'<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M10 6.4v7.2M6.4 10h7.2" stroke-linecap="round"/></svg>');
    add.onclick = function(){ addRow(); renumber(); };
    tda.appendChild(add);
    if(tb.rows.length > 2){
      var del = el("span","idxdel",'<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M6.4 10h7.2" stroke-linecap="round"/></svg>');
      del.onclick = function(){ tb.removeChild(tr); renumber(); };
      tda.appendChild(del);
    }
    tr.appendChild(tda);
    tb.appendChild(tr);
  }
  function renumber(){ for(var i=1;i<tb.rows.length;i++){ tb.rows[i].cells[0].textContent = String(i); } }
  addRow(); renumber();
  w.appendChild(tb);
  return w;
}

  var acts = el("div","megaacts","");
  var mainLbl = editRef ? "保存" : "发布";
  [["保存草稿","p"],["重置",""],["关闭",""],[mainLbl,"p"]].forEach(function(x){
    var b = el("button","btn btn-sm"+(x[1]?" btn-primary":""), x[0]);
    b.onclick = function(){
      if(x[0]==="关闭"){ closeModal(); return; }
      if(x[0]==="重置"){ toast("已重置表单"); return; }
      if(x[0]==="保存草稿"){ toast("草稿已保存"); closeModal(); return; }
      if(!nameInp.value){ toast("请输入活动名称"); return; }
      if(editRef){
        editRef.row.aname = nameInp.value;
        editRef.row.atype = tplName;
        editRef.row.tpl = tplName+"模板";
        editRef.row.utime = new Date().toISOString().slice(0,19).replace("T"," ");
        editRef.row.uname = "admin0";
        toast("活动保存成功"); closeModal(); renderContent(); return;
      }
      var newRow = {sort:tabRef.rows.length+1, aid:"ACT"+Math.floor(100000+Math.random()*90000),
        aname:nameInp.value, img:"[图片]", atype:tplName, tpl:tplName+"模板", mode:"自动发放",
        ratio:"1.0倍", terminal:"全部", status:"未开始", atime:"长期", showtime:"长期",
        utime:new Date().toISOString().slice(0,19).replace("T"," "), uname:"admin0", site:currentSiteChoice(siteVal)};
      tabRef.rows.unshift(newRow); tabRef._all.unshift(newRow);
      toast("活动发布成功"); closeModal(); renderContent();
    };
    acts.appendChild(b);
  });
  head.appendChild(acts);
  var xs = el("span","mclose","×"); xs.onclick = closeModal;
  head.appendChild(xs);
  var bodyBox = el("div","mbody megabody");
  bodyBox.appendChild(bodyEl);
  modal.appendChild(head); modal.appendChild(bodyBox);
  mask.appendChild(modal); root.appendChild(mask);
}
initApp();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>惊喜活动3 · C端原型</title>
<style>
  :root{
    --bg:#3a3a3a; --panel:#2b2b2b; --text:#e8e8e8; --muted:#9a9a9a; --line:#444;
    --purple1:#7b2ff7; --purple2:#4a0fb0; --gold1:#ffe9a8; --gold2:#ffb627; --red:#ff1f1f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:32px 16px;flex-wrap:wrap}
  /* 左侧导航 */
  .phone{order:1}
  .side{order:2;width:380px;background:var(--panel);border-radius:12px;padding:20px;position:sticky;top:32px}
  .note{font-size:13px !important}
  .side h1{font-size:18px;margin-bottom:4px}
  .side .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .nav button{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:13px}
  .nav button.active{border-color:var(--purple1);background:rgba(123,47,247,.18)}
  .nav button small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .note{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;line-height:1.7;color:#cfcfcf}
  .note b{color:#fff}
  .note ul{padding-left:16px}
  .reset{margin-top:12px;width:100%;padding:8px;border-radius:8px;border:none;background:#555;color:#fff;cursor:pointer}
  /* 手机框 */
  .phone{width:375px;height:760px;border-radius:36px;background:#000;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);flex-shrink:0}
  .screen{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;background:#222}
  .tag{position:absolute;top:10px;left:12px;font-size:11px;color:#8ab4ff;z-index:50;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:10px}
  .view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
  .view.show{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.65)}

  /* ① H5 白色弹窗 */
  .h5bg{position:absolute;inset:0;background:linear-gradient(#2a2a2a,#1b1b1b);display:flex;flex-direction:column;align-items:center;padding-top:60px;color:#666;font-size:13px}
  .h5bg .fake{width:85%;height:120px;border-radius:12px;background:#333;margin-bottom:14px}
  .wdlg{position:relative;width:300px;background:#fff;border-radius:10px;padding:28px 22px 22px;text-align:center;z-index:2}
  .wdlg h3{color:#222;font-size:20px;margin-bottom:10px}
  .wdlg p{color:#888;font-size:14px;line-height:1.6;margin-bottom:22px}
  .wbtns{display:flex;gap:10px}
  .wbtns button{flex:1;height:44px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
  .wbtns .gray{background:#f1f1f1;color:#222}
  .wbtns .red{background:var(--red);color:#fff}

  /* 过渡页 */
  .loading{color:#ccc;font-size:14px;text-align:center;gap:16px}
  .spinner{width:36px;height:36px;border:3px solid #555;border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ② 开盲盒 */
  .boxpage{background:#202020}
  .boxpage .t1{font-size:15px;color:#fff;margin-bottom:6px}
  .boxpage .t2{font-size:18px;font-weight:800;color:var(--gold1);margin-bottom:26px}
  .grid{display:grid;grid-template-columns:repeat(2,130px);gap:22px 40px}
  .gift{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative}
  .gift span{color:#fff;font-size:14px}
  .giftbox{width:96px;height:96px;position:relative;transition:transform .2s}
  .gift:hover .giftbox{transform:scale(1.06)}
  .giftbox .body{position:absolute;bottom:0;left:8px;width:80px;height:62px;border-radius:8px;background:linear-gradient(135deg,#b86bff,#6a1fd6);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
  .giftbox .lid{position:absolute;top:22px;left:2px;width:92px;height:22px;border-radius:6px;background:linear-gradient(135deg,#c98bff,#7d2ff0);transition:transform .5s}
  .giftbox .rib-v{position:absolute;left:42px;top:22px;width:12px;height:74px;background:linear-gradient(var(--gold1),var(--gold2))}
  .giftbox .rib-h{position:absolute;left:8px;top:62px;width:80px;height:10px;background:linear-gradient(var(--gold1),var(--gold2))}
  .giftbox .bow{position:absolute;top:4px;left:28px;width:40px;height:22px}
  .giftbox .bow:before,.giftbox .bow:after{content:"";position:absolute;top:0;width:20px;height:20px;border:5px solid var(--gold2);border-radius:50% 50% 0 50%}
  .giftbox .bow:before{left:-2px;transform:rotate(-20deg)}
  .giftbox .bow:after{right:-2px;transform:rotate(110deg)}
  .gift.opening .lid,.gift.opening .bow{transform:translateY(-30px) rotate(-18deg);opacity:.0;transition:all .5s}
  .gift.opening .giftbox{animation:shake .5s}
  .gift.dim{opacity:.35;pointer-events:none}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .hand{position:absolute;right:-6px;bottom:18px;font-size:30px;animation:tap 1s infinite;pointer-events:none}
  @keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-6px)}}
  .xbtn{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;border:none;font-size:20px;font-weight:700;cursor:pointer;margin-top:30px;box-shadow:0 4px 16px rgba(255,255,255,.2)}

  /* ③④ 紫金弹窗 */
  .pdlg{position:relative;z-index:2;width:320px;display:flex;flex-direction:column;align-items:center}
  .hero{width:200px;height:120px;position:relative;margin-bottom:-18px;z-index:1}
  .hero .glow{position:absolute;inset:-30px;background:radial-gradient(circle,rgba(255,214,120,.5),transparent 65%)}
  .hero .coins{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:58px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .ribbon{position:relative;z-index:3;background:linear-gradient(var(--gold1),var(--gold2));color:#c0391b;font-weight:900;font-size:20px;padding:8px 40px;border-radius:8px;box-shadow:0 4px 0 #c97a0f;margin-bottom:-18px}
  .card{width:100%;background:linear-gradient(#8a3bff,var(--purple2));border:5px solid var(--gold2);border-radius:26px;padding:40px 22px 24px;text-align:center;box-shadow:0 0 30px rgba(140,60,255,.5)}
  .card p{color:#fff;font-size:15px;line-height:1.6;margin-bottom:22px}
  .amount{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:22px}
  .coin{width:46px;height:46px;border-radius:50%;background:radial-gradient(#ffd34d,#f08c00);color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;border:3px solid #fff3c4}
  .amount .num{font-size:30px;font-weight:800;color:#fff;letter-spacing:.5px}
  .pbtns{display:flex;gap:12px}
  .pbtns button{flex:1;height:44px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
  .pbtns .ghost{background:transparent;border:1.5px solid #fff;color:#fff}
  .pbtns .gold{background:linear-gradient(#fff6d6,#ffd36b);border:none;color:#5a2a00}
  .pdlg .xbtn{margin-top:22px}

  /* 结束态 */
  .end{color:#ccc;text-align:center;gap:12px;font-size:14px}
  .end .big{font-size:42px}
  .end button{margin-top:10px;padding:8px 18px;border-radius:8px;border:none;background:#555;color:#fff;cursor:pointer}
  .toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;z-index:60;display:none}
  @media (max-width:700px){.side{position:static;width:100%;max-width:375px}.phone{width:100%;max-width:375px}}
</style>
</head>
<body>

<aside class="side">
  <h1>惊喜活动3 · C端原型</h1>
  <div class="sub">点击手机内按钮可走完整流程，也可从下方直接跳转页面</div>
  <div class="nav" id="nav">
    <button data-go="box">① 开盲盒页<small>后台配置的触发场景下自动弹出，多选 1</small></button>
    <button data-go="quit">② 放弃确认弹窗<small>开盲盒页点 ✕ 触发</small></button>
    <button data-go="reward">③ 中奖结果弹窗<small>开盒后展示金额</small></button>
  </div>
  <div class="note" id="note"></div>
  <button class="reset" onclick="go('box')">↺ 从头开始</button>
</aside>

<div class="phone"><div class="screen">
  <div class="tag" id="tag"></div>
  <div class="toast" id="toast"></div>

  <!-- ② 开盲盒 -->
  <section class="view boxpage" id="v-box">
    <div class="mask" style="background:rgba(0,0,0,.35)"></div>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center">
      <div class="t1">你已成功登录</div>
      <div class="t2">🎉 随机惊喜已激活 🎉</div>
      <div class="grid" id="grid"></div>
      <button class="xbtn" onclick="go('quit')">✕</button>
    </div>
  </section>

  <!-- ③ 放弃确认 -->
  <section class="view" id="v-quit">
    <div class="mask" style="background:rgba(0,0,0,.8)"></div>
    <div class="pdlg">
      <div class="hero"><div class="glow"></div><div class="coins">💰</div></div>
      <div class="ribbon">注意</div>
      <div class="card">
        <p>关闭后，即视为你<br>自愿放弃本次惊喜奖励。</p>
        <div class="pbtns">
          <button class="ghost" onclick="go('box')">取消</button>
          <button class="gold" onclick="go('abandon')">确认放弃</button>
        </div>
      </div>
      <button class="xbtn" onclick="go('box')">✕</button>
    </div>
  </section>

  <!-- ④ 中奖结果 -->
  <section class="view" id="v-reward">
    <div class="mask" style="background:rgba(0,0,0,.8)"></div>
    <div class="pdlg">
      <div class="hero"><div class="glow"></div><div class="coins">💰</div></div>
      <div class="ribbon">恭喜！</div>
      <div class="card">
        <div class="amount">
          <div class="coin">$</div>
          <div class="num" id="amt">123,456</div>
        </div>
        <div class="pbtns">
          <button class="gold" style="flex:1" onclick="go('claimed')">立即领取</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 结束态 -->
  <section class="view end" id="v-claimed">
    <div class="big">✅</div>
    <div>奖励已到账</div>
    <div style="color:#888;font-size:12px">金额 <span id="amt2"></span> 已到账，活动结束</div>
    <button onclick="go('box')">重新体验</button>
  </section>
  <section class="view end" id="v-abandon">
    <div class="big">👋</div>
    <div>已放弃本次惊喜奖励</div>
    <div style="color:#888;font-size:12px">活动关闭，之后不再弹出</div>
    <button onclick="go('box')">重新体验</button>
  </section>
</div></div>

<script>
  const NOTES = {
    box:`<b>① 开盲盒页</b><ul>
      <li>场景：满足后台配置活动条件的用户，在后台配置的触发场景下自动弹出</li>
      <li>多个礼盒任选 1 个（原型以 4 个宝箱为例），用手势动效引导点击</li>
      <li>点礼盒 → 开盒动画 → 中奖弹窗</li>
      <li>点 ✕ → 放弃确认弹窗</li>
      <li><b>金额说明：</b>奖励金额在用户获得活动资格时就已确定，无论点开哪个礼盒，展示的金额都一样</li>
      <li>多选 1 只是一种让玩家更有参与感的交互，选哪个礼盒都不影响金额</li></ul>`,
    quit:`<b>② 放弃确认弹窗</b><ul>
      <li>「取消」/ 底部 ✕：回到开盲盒页</li>
      <li>「确认放弃」：活动弹窗关闭，之后不再弹出</li>
      <li>后台记录：这条奖励标记为「未领取」，到期后自动改为「已到期」</li></ul>`,
    reward:`<b>③ 中奖结果弹窗</b><ul>
      <li>展示用户获得资格时就已确定的奖励金额，跟点了哪个礼盒无关（按币种格式显示，越南盾不带小数）</li></ul>`,
    claimed:`<b>领取成功</b><ul><li>奖励入账，活动结束</li></ul>`,
    abandon:`<b>已放弃</b><ul><li>活动弹窗关闭，之后不再弹出</li><li>后台状态：未领取 → 到期后自动改为已到期</li></ul>`
  };
  const TAGS = {box:'① 惊喜活动3',quit:'② 惊喜活动3-弹窗',reward:'③ 惊喜活动3-奖励',claimed:'结束：已领取',abandon:'结束：已放弃'};

  const PRESET_AMOUNT = 123456; // 示例：用户获得资格时由后台确定的金额
  function renderGifts(){
    const g=document.getElementById('grid'); g.innerHTML='';
    for(let i=0;i<4;i++){
      const d=document.createElement('div'); d.className='gift';
      d.innerHTML=`<div class="giftbox"><div class="body"></div><div class="rib-v"></div><div class="rib-h"></div><div class="lid"></div><div class="bow"></div></div><span>打开</span>${i===2?'<div class="hand">👆</div>':''}`;
      d.onclick=()=>openGift(d);
      g.appendChild(d);
    }
  }
  function openGift(el){
    document.querySelectorAll('.gift').forEach(x=>{ if(x!==el) x.classList.add('dim'); x.style.pointerEvents='none'; const h=x.querySelector('.hand'); if(h) h.remove(); });
    el.classList.add('opening');
    const s=PRESET_AMOUNT.toLocaleString('en-US'); // 金额已预先确定，与所选礼盒无关
    document.getElementById('amt').textContent=s;
    document.getElementById('amt2').textContent=s;
    setTimeout(()=>go('reward'),700);
  }
  function go(k){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('show'));
    document.getElementById('v-'+k).classList.add('show');
    document.getElementById('tag').textContent=TAGS[k];
    document.getElementById('note').innerHTML=NOTES[k];
    document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===k));
    if(k==='box') renderGifts();
  }
  function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1600);}
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
  go('box');
</script>
</body>
</html>
